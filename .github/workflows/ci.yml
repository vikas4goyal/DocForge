# CI pipeline for DocForge.
#
# Runs the gate sequence mandated by the project context, in order, and fails on
# any formatting, analysis, layering, test or coverage violation. Platform builds
# cover Android and iOS only — there is deliberately no web or desktop job.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  verify:
    name: Verification gate (host stages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Codegen output is not committed, so it must exist before analysis and
      # tests run. Note: --delete-conflicting-outputs was removed in the current
      # build_runner and must not be passed.
      - name: Generate code
        run: dart run build_runner build

      # One command rather than six steps, so CI and a developer's terminal run
      # the same gate in the same order. `tool/verify.dart` sequences format,
      # analyse, layering, platforms, Tier 1 + Tier 2 and coverage, and fails
      # fast on the first of them.
      #
      # `--no-device` because this runner has none. The gate then reports
      # INCOMPLETE and exits 2 — deliberately not zero, because passing every
      # host stage is not the same as the change working. This job accepts that
      # one code and nothing else, so a genuine failure (exit 1) still fails the
      # build. The authoritative verdict comes from the `integration` job below,
      # which runs the same command with a device attached.
      - name: Run the verification gate (host stages)
        run: |
          set +e
          dart run tool/verify.dart --no-device
          code=$?
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 2 ]; then
            echo "Host stages passed. Tier 3 is covered by the integration job."
            exit 0
          fi
          exit "$code"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  golden:
    name: Golden tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      # Goldens are generated on this single canonical configuration only.
      # Running them on more than one platform produces font-rendering diffs
      # that are noise, not regressions.
      - name: Run golden tests
        run: flutter test --tags golden

  android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter build apk --debug

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      # An unsigned build (`--no-codesign`) is NOT possible for this app:
      # pdf_manipulator ships a native-asset engine that must be code-signed
      # into the bundle, so Xcode requires a Development Team. Verified by A/B
      # test — removing the package makes --no-codesign succeed again.
      #
      # This step therefore validates everything up to the signed link: pubspec
      # resolution, pod resolution, and the generated Xcode configuration. It
      # catches dependency and plugin breakage, which is what this job is for.
      - name: Validate iOS configuration and pods
        run: |
          flutter build ios --config-only
          cd ios && pod install --repo-update

      # The full signed build runs only once signing credentials are configured.
      # Add IOS_CERTIFICATE_P12, IOS_CERTIFICATE_PASSWORD and
      # IOS_PROVISIONING_PROFILE as repository secrets to enable it.
      - name: Build signed iOS app
        if: ${{ env.HAS_SIGNING == 'true' }}
        env:
          HAS_SIGNING: ${{ secrets.IOS_CERTIFICATE_P12 != '' }}
        run: flutter build ios --debug

  integration:
    name: Verification gate (with a device)
    # Runs on an Android emulator, NOT an iOS simulator. GoogleMLKit ships no
    # arm64 simulator slices, so the OCR dependency cannot be built for an
    # Apple Silicon iOS simulator at all — and GitHub's macOS runners are Apple
    # Silicon. iOS integration coverage therefore requires a physical device
    # and is handled in the manual device-verification task, not here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The full gate, with a device. This is the only job whose green means
      # the change is verified: it runs every host stage and then every flow,
      # and reports PASSED only when Tier 3 actually ran.
      - name: Run the verification gate on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: dart run tool/verify.dart
