schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  # doc_forge — Project Context

  ## General
  - Project type: Flutter (production application)
  - Language: Dart (SDK ^3.12.2)
  - Target platforms: Android and iOS ONLY
  - Explicitly out of scope: Web, macOS, Windows, Linux. Never propose,
    scaffold, or add dependencies for these platforms.
  - Version 1 is offline-first, but every design must leave room for future
    cloud sync.

  ## Architecture — Feature-First Clean Architecture
  Every feature lives in `lib/features/<feature>/` and contains exactly these
  layers:
    presentation/    # widgets, screens, Cubits bound to UI
      cubit/           # Cubit + immutable State per screen/flow
      screens/         # full pages wired to Cubits
      widgets/         # reusable widgets for this feature
    application/     # orchestration
      usecases/        # one use case per business operation
    domain/          # pure business core, depends on nothing
      entities/        # entities and value objects
      repositories/    # repository interfaces (abstractions)
      failures/        # typed failures / error model
    infrastructure/  # outward-facing implementations
      datasource/      # Isar, SharedPreferences, secure storage, Dio clients
      models/          # DTOs with Freezed + json_serializable, mappers
      repositories/    # repository implementations of domain interfaces
  Shared/cross-cutting code lives in `lib/core/` (or `lib/shared/`).

  Rules:
  - No feature may import from another feature directly.
  - Cross-feature communication happens through abstractions only (domain-level
    interfaces declared in core/shared and injected via constructors).
  - Dependency direction: presentation -> application -> domain; infrastructure
    depends on domain and implements its interfaces. Domain depends on nothing.

  ## State management — flutter_bloc
  - flutter_bloc is the project's official and only state management solution.
  - Prefer Cubit. Use a full Bloc only when an event-driven workflow clearly
    benefits from explicit events (event transformers, debounce/throttle,
    replayable event streams, complex event sequencing).
  - Do NOT introduce Riverpod, package:provider, GetX, or similar alternatives.
  - Each feature owns its own Cubit(s) and its own immutable State.
  - State classes are immutable, extend Equatable, and live beside their Cubit.
    List every field in `props` so `emit` correctly de-duplicates identical
    states and `bloc_test` can assert on state sequences by value.
    (Equatable is for Cubit states only — domain models and DTOs still use
    Freezed + json_serializable.)
  - Business logic must NEVER live inside a Cubit. A Cubit is responsible only
    for:
      * managing UI state
      * invoking use cases
      * emitting immutable states
  - Business rules belong in the domain layer (entities, value objects) and are
    orchestrated by use cases in the application layer.

  ## Navigation
  - GoRouter with typed routes (go_router_builder / TypedGoRoute).
  - No untyped string-literal navigation in feature code.

  ## Models
  - Freezed for immutable models and sealed unions.
  - json_serializable for (de)serialization.
  - No manual JSON parsing anywhere. All models are immutable.

  ## Data & storage
  - Primary database: Isar
  - Simple preferences: SharedPreferences
  - Sensitive data (tokens, secrets, PII): flutter_secure_storage
  - Storage access is always behind a domain-level repository interface.

  ## Networking
  - Dio, wrapped behind repository abstractions.
  - Networking layer designed for future cloud sync (interceptors, retry,
    auth token refresh, cancellation, typed error mapping).

  ## Dependency injection — explicit constructors
  - Dependencies are passed explicitly through constructors. Keep DI simple and
    explicit.
  - Do NOT introduce get_it or any other service locator, and do not use
    Riverpod for DI.
  - Composition happens near the application root: build data sources ->
    repositories -> use cases -> Cubits there and pass them down.
  - Cubits are supplied to the widget tree with BlocProvider; widgets read them
    with context.read / context.watch / BlocBuilder / BlocSelector.
  - No singletons and no global mutable state for dependency access.

  ## Code style
  - Follow Effective Dart.
  - Prefer: const constructors, immutable classes, sealed classes, extension
    methods, composition over inheritance, small widgets, small files.
  - Avoid: God classes, singletons, global mutable state, massive widgets,
    business logic inside UI.
  - Avoid large Cubits. A Cubit coordinates state only; split it when it grows.
  - Layer responsibilities are strict:
      * Cubits          -> UI state coordination, invoke use cases, emit states
      * Use cases       -> business logic
      * Repositories    -> persistence abstraction (domain interfaces)
      * Infrastructure  -> implements repositories and talks to storage/network
  - Presentation must NEVER directly access storage (Isar, SharedPreferences,
    flutter_secure_storage) or Dio. It goes through Cubit -> use case ->
    repository.

  ## Code documentation (mandatory)
  - Every public class, function, method, constructor, and top-level constant
    carries a dartdoc comment (`///`). Follow Effective Dart doc guidelines.
  - Start with a single-sentence summary in the third person ("Loads the ...",
    not "Load the ..."), then a blank `///` line before further detail.
  - Function and method docs must state: what it does, its parameters, what it
    returns, and which failures/exceptions it can produce.
  - Reference other APIs with square brackets (`[DocRepository]`) so dartdoc
    links them.
  - Document every Cubit (what UI state it owns), every State variant (what it
    means), every use case (which business rule it enforces), and every
    repository interface (its contract, including offline behaviour).
  - Add a short `///` doc to each widget describing its purpose, its required
    inputs, and its widget keys / semantics labels.
  - Inline comments (`//`) are required wherever intent is not obvious from the
    code: non-trivial algorithms, workarounds, platform quirks, Isar schema or
    migration decisions, concurrency/isolate boundaries, and any deliberate
    trade-off. Explain WHY, not WHAT the line already says.
  - Keep documentation truthful and current — update docs in the same change
    that alters the behaviour. Stale docs are treated as defects.
  - Do not add noise comments that merely restate the code.

  ## UI
  - Material 3 with adaptive Cupertino widgets where platform-appropriate.
  - Responsive layouts including tablet support.
  - Dark mode support is mandatory.
  - Accessibility is mandatory: semantics labels, contrast, text scaling,
    touch target sizes.

  ## Widget previews (mandatory)
  - Flutter supports SwiftUI-style widget previews via the `@Preview()`
    annotation from `package:flutter/widget_previews.dart`, rendered with
    `flutter widget-preview start`.
  - EVERY reusable widget and every screen must ship at least one `@Preview()`
    entry alongside it.
  - Every reusable widget and every screen must preview these states:
      * default
      * loading
      * empty
      * error
      * long content
  - Screens must additionally preview:
      * phone
      * tablet
      * light theme
      * dark theme
  - Preview data must come from fixtures. No live services, no network, no real
    database, no randomness or wall-clock dependence.
  - Feed previews by constructing the widget with fixture data directly, or by
    wrapping it in a BlocProvider whose Cubit is seeded to the desired state
    (or a fake Cubit that emits fixed states).
  - Preview functions are const-friendly, self-contained, and named clearly
    (e.g. `@Preview(name: 'DocCard — dark')`).
  - Widgets must be previewable by construction: no hidden dependency on
    ambient state that a preview cannot supply.

  ## Performance
  - Prefer lazy loading, background isolates for heavy work, memory
    optimisation, and battery optimisation.
  - Avoid unnecessary rebuilds: prefer BlocSelector and `buildWhen` to rebuild
    only the smallest affected subtree, and use const widgets.

  ## Testing (mandatory)
  - Every implementation must include ALL of the following:
      * Unit tests
      * Widget tests
      * Cubit tests (bloc_test — assert emitted state sequences)
      * Repository tests
      * Serialization tests
      * Navigation tests
      * Integration tests
  - Major screens additionally require golden tests.
  - A feature is incomplete until every required test exists and passes.
  - Mock platform integrations where appropriate.
  - Overall code coverage must stay >= 80%. Business logic coverage target
    is >= 90%.

  ## AI implementation guidelines
  The codebase is optimised for AI-assisted development. Every implementation
  must satisfy all of the following:
  - Behaviour must be deterministic — same inputs produce the same states.
  - Avoid hidden state.
  - Avoid static mutable state.
  - Avoid global mutable variables.
  - Every feature must be independently testable in isolation, with its
    dependencies substitutable via constructor injection.
  - Every feature exposes stable widget keys (`Key('<feature>_<element>')`).
  - Every important widget exposes a semantics label.
  - Every implementation must be easily exercised by automated Flutter
    integration tests, end to end.

  ## Tooling — Dart/Flutter MCP server
  The `dart` MCP server is connected and is the preferred way to do Dart and
  Flutter work that its tools cover. Use it rather than shelling out whenever
  one of its tools fits:
  - `analyze_files` / `lsp` — static analysis, symbol lookup, references,
    rename. Faster and more precise than grepping for a symbol.
  - `pub` — dependency operations (`get`, `add`, `upgrade`, `outdated`).
  - `pub_dev_search` — check a candidate package's licence, platform support
    and maintenance before adding it. Licence must be permissive and usable
    commercially; Syncfusion and other commercial-licence packages are barred.
  - `read_package_uris` / `rip_grep_packages` — read a dependency's own source
    when its behaviour or API is unclear. Both `package:` and `package-root:`
    URIs resolve, so examples and tests inside a package are reachable.
  - `hot_reload` / `hot_restart` / `widget_inspector` / `get_runtime_errors` /
    `flutter_driver_command` — driving a running app on a device or simulator,
    which is the only way to verify the parts of this project that cannot run
    in the host test VM (camera, OpenCV edge detection, ML Kit recognition,
    biometrics, the share sheet and the print dialog).
  `flutter test`, `flutter build` and the repository's own `tool/check_*.dart`
  scripts still run through the shell; the MCP server does not replace them.

  ## CI
  CI must run, in order: `flutter pub get`, `dart format --set-exit-if-changed`,
  `flutter analyze`, `flutter test`, integration tests, golden tests, coverage.
  The build fails when coverage < 80%, analysis fails, tests fail, or
  formatting fails.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - State the architecture impact, including which feature folders and layers
      are touched.
    - Include the resulting folder structure under
      presentation/application/domain/infrastructure.
    - List new or changed dependencies and justify each one.
    - Include migration considerations (Isar schema migrations, stored
      preference keys, secure-storage keys, route changes).
    - Include performance considerations (rebuild cost, isolate usage, lazy
      loading, memory, battery).
    - Include security considerations (what data is sensitive and where it is
      stored).
    - "Explain what is added or changed for each of: Cubits, States, use cases,
      repositories, Isar schema, navigation."
    - Include the testing strategy across unit, widget, Cubit, repository,
      serialization, navigation, integration, and golden tests.
    - "Include preview coverage: which widgets and screens gain `@Preview()`
      entries and which states, themes, and form factors they cover."
    - Include an explicit Definition of Done.
    - Include risks and mitigations.
    - Include future extensibility, especially the path to cloud sync.
    - Confirm the change is Android/iOS only; never introduce web or desktop
      support.
  design:
    - Respect feature-first clean architecture; show the dependency direction
      and prove no feature-to-feature coupling.
    - Specify the Cubits and their immutable States (name each state variant and
      the transitions between them); justify any use of a full Bloc over a
      Cubit.
    - Specify the use cases that hold the business logic, and confirm no
      business logic sits inside a Cubit.
    - Show how dependencies are constructed and passed explicitly through
      constructors from the composition root; no service locators.
    - Specify Freezed models and json_serializable contracts; no manual JSON.
    - Specify GoRouter typed routes for any navigation change.
    - Specify persistence choice per data item — Isar, SharedPreferences, or
      flutter_secure_storage — with a rationale.
    - Define widget keys and semantics labels for every screen and important
      control.
    - "Define the `@Preview()` coverage for each new widget and screen: which
      states, themes, and form factors are previewed and which fixtures feed
      them."
    - Call out anything that would introduce hidden state, static or global
      mutable state, or nondeterminism, and how it is avoided.
    - Note which new public APIs require dartdoc and which areas need inline
      comments explaining intent.
  specs:
    - Write requirements as observable, testable behaviour.
    - Include accessibility, dark mode, responsive/tablet, and offline-first
      behaviour as explicit requirements where relevant.
    - Reference the widget keys and semantics labels that automated UI tests
      will rely on.
  tasks:
    - Break tasks into chunks of at most 2 hours.
    - Pair every implementation task with its test task; a task is not done
      until its tests pass.
    - Include a task for `@Preview()` entries whenever a widget or screen is
      added or changed.
    - Include a Cubit test task (bloc_test) for every Cubit added or changed.
    - Include a task for dartdoc comments on new public APIs and inline
      comments explaining non-obvious logic.
    - Include tasks for `dart format`, `flutter analyze`, and coverage
      verification before completion.
    - Include a golden-test task for any new or materially changed major
      screen.
