name: doc_scanly
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  firebase_core: ^4.12.1
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  firebase_performance: ^0.11.4+5
  equatable: ^2.1.0
  bloc_concurrency: ^0.3.0
  go_router: ^17.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  dio: ^5.11.0
  camera: ^0.12.0+2
  image: ^4.9.1
  pdf: ^3.13.0
  printing: ^5.15.0
  pdfrx: ^2.4.7
  permission_handler: ^12.0.3
  local_auth: ^3.0.2
  image_picker: ^1.2.3
  file_picker: ^11.0.2
  # Pinned <13.1.0: share_plus 13.1.0+ needs win32 ^6.0.1, but every
  # file_picker below 12.0.0-beta.1 needs win32 ^5.9.0.
  share_plus: ^12.0.2
  path_provider: ^2.1.6
  intl: ^0.20.3
  uuid: ^4.6.0
  collection: ^1.19.1
  receive_sharing_intent: ^1.9.0
  # Vendored fork of pdf_manipulator 4.0.0 — upstream ships no iOS dynamic
  # binary, so iOS builds otherwise require a Rust toolchain everywhere.
  # See third_party/pdf_manipulator/LOCAL_PATCH.md. Restore the line below
  # once upstream publishes ios-*-libpdf_oxide.dylib:
  #   pdf_manipulator: ^4.0.0
  pdf_manipulator:
    path: third_party/pdf_manipulator
  # Pinned: the Flutter SDK's flutter_test pins meta to exactly 1.18.0.
  meta: ^1.18.0
  stream_transform: ^2.1.1
dependency_overrides:
  # Vendored fork: 11.0.3 skips KGP on AGP 9, but Flutter temporarily opts
  # this project out of built-in Kotlin because other plugins still apply KGP.
  # See third_party/file_picker/LOCAL_PATCH.md.
  file_picker:
    path: third_party/file_picker
  # Vendored fork: upstream 3.3.2 ships an iOS XCFramework with simulator
  # slices, but does not expose it through Swift Package Manager.
  # See third_party/isar_community_flutter_libs/LOCAL_PATCH.md.
  isar_community_flutter_libs:
    path: third_party/isar_community_flutter_libs
  # Vendored fork: upstream cannot detect which iOS permissions to compile in
  # when the app uses Swift Package Manager, so it silently compiles none and
  # no permission prompt is ever shown.
  # See third_party/permission_handler_apple/LOCAL_PATCH.md.
  permission_handler_apple:
    path: third_party/permission_handler_apple

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Already present transitively through flutter_bloc; declared so the
  # component-test harness can name `SingleChildWidget` in a signature. Typing
  # that parameter as `BlocProvider<dynamic>` instead is not an option: it makes
  # Dart infer `BlocProvider.value(value: cubit)` as `BlocProvider<dynamic>`,
  # which provides `dynamic` and leaves every screen unable to find its Cubit.
  provider: ^6.1.5

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # Pinned <2.15.2: build_runner 2.15.2+ needs analyzer >=13.3.0, but
  # isar_community_generator 3.3.2 (latest) pins analyzer <11.
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  isar_community_generator: ^3.3.2
  go_router_builder: ^4.4.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  alchemist: ^0.14.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Fixtures for the Tier-3 flow suite. Bundled because an integration test
  # runs on a device, where the only way to reach a checked-in file is through
  # the asset bundle. They are a few hundred bytes of generated shapes and text
  # and contain no personal data.
  assets:
    - integration_test/fixtures/

  # To add further assets, add them to the section above, like this:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
